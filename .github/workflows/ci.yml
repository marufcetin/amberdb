name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        perl:
          - '5.40'
          - '5.38'
          - '5.36'
          - '5.34'
          - '5.30'
          - '5.26'
          - '5.20'
          - '5.16'
        exclude:
          # Limit some Windows/macOS combinations for speed while ensuring broad coverage
          - os: windows-latest
            perl: '5.20'
          - os: windows-latest
            perl: '5.16'
          - os: macos-latest
            perl: '5.20'
          - os: macos-latest
            perl: '5.16'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdb-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install berkeley-db
          echo "DB_FILE_INCLUDE=$(brew --prefix berkeley-db)/include" >> $GITHUB_ENV
          echo "DB_FILE_LIB=$(brew --prefix berkeley-db)/lib" >> $GITHUB_ENV

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: ${{ (startsWith(matrix.os, 'windows-') && 'strawberry') || 'default' }}

      - name: Perl Version & Info
        run: perl -V

      - name: Install Dependencies
        run: |
          cpanm --notest --installdeps .

      - name: Build & Test
        shell: bash
        run: |
          perl Makefile.PL
          if [ "${{ runner.os }}" = "Windows" ]; then
            gmake
          else
            make
          fi
          prove -b -r t/
