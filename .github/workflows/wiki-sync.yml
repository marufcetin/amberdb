name: Sync Wiki to GitHub

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Wiki Files to GitHub Wiki Repo
        uses: Andrew-Chen-De-France/github-wiki-action@v4
        with:
          path: 'wiki'
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: '.*'
